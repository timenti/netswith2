name: Plennor iOS v8 Test

on:
  push:
    branches:
      - plennor-ios-v5-test
  workflow_dispatch:

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated v8 from live Plennor
        working-directory: plennor-ios-v5-test
        run: |
          node build-v7.mjs
          node post-v8.mjs

      - name: Verify build before deploy
        working-directory: plennor-ios-v5-test
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/V7_BUILD.json
          test -f dist/V8_BUILD.json
          grep -q "v8-standalone-bottom-bridge" dist/index.html
          grep -q 'plennor-v8-standalone-bottom-bridge' dist/index.html
          grep -q 'margin-bottom: max(104px, calc(174px - var(--plennor-standalone-bottom-bridge)))' dist/index.html
          grep -q '>V8</div>' dist/index.html
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('dist/V8_BUILD.json','utf8'));if(j.build!=='v8-standalone-bottom-bridge'||j.gestureBase!=='v7-touchmove-commit')process.exit(1);console.log(j)"

      - name: Deploy isolated v8 to Netlify
        working-directory: plennor-ios-v5-test/dist
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 8cc687a9-4608-4905-9ea7-622a1b8174ed
          --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..QZQmifNf6yFwzYZ5.CvskW6lKXa0iSADHQoEyi0Iv7hy4RvIBw0kxxq-s2vQnjle12BQQCIpIgWh646OSRSOBjUStcELjcGqvF4tcy_1SYx9w2tvJfGIaVchu1XURD4t38aaEJI5l6U9-4dJ2uUMQ05Prv12PhbnQqFGYijcBMoYJFee5a7MX9DuM1wPyAj-Bq2D2PPPVLsXXGwvXwyVGZOZ3urIErXMCGBNkNXRwanDavR-6Ky1WDaQBdQ02OIPWLxkr_sUS2laiK7DLV4KcgCVXIWEDvZdTgqjJ0paw-Z_EoQ6AC4TtudzNN597JUPRuqigVBYsNX2EHfhyuzoFthc11V1ydMT7QqhAuSihNI7xE7KKlkW0CvaKkaKOd2Z-8Lx0DChGpkKlcG5nkYgSBnpm.r_-ps2iYUKbhviuIZyesPg"

      - name: Verify deployed v8
        shell: bash
        run: |
          for i in {1..12}; do
            if curl -fsS --max-time 10 https://plennor-ios-v5-test.netlify.app/V8_BUILD.json -o /tmp/v8.json && grep -q 'v8-standalone-bottom-bridge' /tmp/v8.json; then
              cat /tmp/v8.json
              curl -fsS --max-time 10 https://plennor-ios-v5-test.netlify.app/ -o /tmp/index.html
              grep -q 'v8-standalone-bottom-bridge' /tmp/index.html
              grep -q '>V8</div>' /tmp/index.html
              echo 'DEPLOY_VERIFY_PASS'
              exit 0
            fi
            sleep 3
          done
          echo 'DEPLOY_VERIFY_FAIL'
          exit 1
