name: Plennor iOS v6 Test

on:
  push:
    branches:
      - plennor-ios-v5-test
  workflow_dispatch:

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated v6 from live Plennor
        working-directory: plennor-ios-v5-test
        run: node build-v6.mjs

      - name: Verify build before deploy
        working-directory: plennor-ios-v5-test
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/V6_BUILD.json
          grep -q "v6-real-bundle-touchcancel-zero-gap" dist/index.html
          grep -R -q "touchcancel-commits-horizontal-drag" . || true
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('dist/V6_BUILD.json','utf8'));if(j.build!=='v6-real-bundle-touchcancel-zero-gap')process.exit(1);console.log(j)"

      - name: Deploy isolated v6 to Netlify
        working-directory: plennor-ios-v5-test/dist
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 8cc687a9-4608-4905-9ea7-622a1b8174ed
          --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..QZQmifNf6yFwzYZ5.CvskW6lKXa0iSADHQoEyi0Iv7hy4RvIBw0kxxq-s2vQnjle12BQQCIpIgWh646OSRSOBjUStcELjcGqvF4tcy_1SYx9w2tvJfGIaVchu1XURD4t38aaEJI5l6U9-4dJ2uUMQ05Prv12PhbnQqFGYijcBMoYJFee5a7MX9DuM1wPyAj-Bq2D2PPPVLsXXGwvXwyVGZOZ3urIErXMCGBNkNXRwanDavR-6Ky1WDaQBdQ02OIPWLxkr_sUS2laiK7DLV4KcgCVXIWEDvZdTgqjJ0paw-Z_EoQ6AC4TtudzNN597JUPRuqigVBYsNX2EHfhyuzoFthc11V1ydMT7QqhAuSihNI7xE7KKlkW0CvaKkaKOd2Z-8Lx0DChGpkKlcG5nkYgSBnpm.r_-ps2iYUKbhviuIZyesPg"

      - name: Verify deployed v6
        shell: bash
        run: |
          for i in {1..12}; do
            if curl -fsS --max-time 10 https://plennor-ios-v5-test.netlify.app/V6_BUILD.json -o /tmp/v6.json && grep -q 'v6-real-bundle-touchcancel-zero-gap' /tmp/v6.json; then
              cat /tmp/v6.json
              curl -fsS --max-time 10 https://plennor-ios-v5-test.netlify.app/ -o /tmp/index.html
              grep -q 'v6-real-bundle-touchcancel-zero-gap' /tmp/index.html
              echo 'DEPLOY_VERIFY_PASS'
              exit 0
            fi
            sleep 3
          done
          echo 'DEPLOY_VERIFY_FAIL'
          exit 1
