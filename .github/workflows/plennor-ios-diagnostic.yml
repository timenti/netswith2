name: Plennor iOS Diagnostic

on:
  push:
    branches:
      - plennor-ios-v5-test
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect live Plennor bundle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const SOURCE = 'https://plennor.vercel.app';
          const htmlRes = await fetch(SOURCE, {redirect:'follow'});
          console.log('INDEX_STATUS', htmlRes.status, htmlRes.url);
          const html = await htmlRes.text();
          const m = html.match(/<script\s+src=["']([^"']*\/_expo\/static\/js\/web\/index-[^"']+\.js)["'][^>]*>/);
          if (!m) throw new Error('bundle path not found');
          const bundleUrl = new URL(m[1], SOURCE).toString();
          const jsRes = await fetch(bundleUrl, {redirect:'follow'});
          console.log('BUNDLE_STATUS', jsRes.status, bundleUrl);
          const js = await jsRes.text();
          console.log('BUNDLE_BYTES', js.length);

          const needles = [
            'e.addEventListener("touchstart",y',
            'e.removeEventListener("touchstart",y',
            'let n=null,o=!1,l=!1,v=!1,p=!1;',
            'const f=()=>{const t=n,o=l;',
            'p=!1,v=!1,c.current.disabled||0!==t.button',
            'E=s=>{if(!n||v||s.pointerId!==n.id)return;',
            'w=t=>{if(!n||t.pointerId!==n.id)return;',
            'P=()=>{f(),o=!1},C=e=>',
            'l=!1,n=null,q=0,o&&c.current.onCancel()',
            'onStart:e=>{w.current=!0,C.stopAnimation(),S.current=void 0===e?R*V',
            'e.swipeOutcome=function(t,n,u)',
          ];
          for (const needle of needles) {
            let count = 0, pos = -1, last = -1;
            while ((last = js.indexOf(needle, last + 1)) >= 0) { count++; if (pos < 0) pos = last; }
            console.log('\nNEEDLE', JSON.stringify(needle), 'COUNT', count, 'POS', pos);
            if (pos >= 0) console.log(js.slice(Math.max(0,pos-900), Math.min(js.length,pos+2600)));
          }

          const htmlNeedles = ['#plennor-tab-dock', '--plennor-bottom', 'plennor-ios-viewport-fix'];
          for (const needle of htmlNeedles) {
            const pos = html.indexOf(needle);
            console.log('\nHTML_NEEDLE', needle, 'POS', pos);
            if (pos >= 0) console.log(html.slice(Math.max(0,pos-700), Math.min(html.length,pos+2600)));
          }
          NODE
