name: Check Exact AK Preview

on:
  push:
    branches: [aist-source2-asset-build]
    paths:
      - '.github/workflows/check-exact-ak-preview.yml'
      - 'tools/cs2_asset_probe/check_exact_preview.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          npm init -y >/dev/null
          npm install playwright-core@1.55.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
      - name: Render desktop and mobile exact Source2 object
        env:
          PREVIEW_URL: 'https://timenti-aist-exact-ak-preview-9jkyae0gi-timenti.vercel.app/?_vercel_share=kKL4MDmDHmFemAQeDM2xg0Nszv3ykMoo'
        run: |
          node tools/cs2_asset_probe/check_exact_preview.mjs work/exact-preview-check
      - name: Upload render-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ak-preview-render-gate-v4
          path: work/exact-preview-check/**
          if-no-files-found: warn
          retention-days: 7
